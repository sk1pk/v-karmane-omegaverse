</style></head><body><header><div><h1>Сумрачный питомник</h1><small>Коллекция существ, лунные экспедиции и маленькие тайны · v0.1</small></div><div class="row"><span id="coins">◈ 0</span><span id="day">День 1</span><button class="tiny" onclick="openSettings()">Настройки</button></div></header><main class="shell"><nav class="nav" id="nav"></nav><div id="app"></div><div class="footer">Локальная игра · Прогресс хранится только в этом браузере · Отдельно от «В кармане»</div></main><div id="modalroot"></div><div id="toastroot"></div><script>
'use strict';
const KEY='sumrachny_pitomnik_independent_v01';
const SPECIES=[{id:'noct',name:'Нокт',desc:'Сумрачный зверёк',zone:'forest',shape:'fox',colors:['#3a315b','#8d81bd']},{id:'lumen',name:'Люмен',desc:'Лунный мотылёк',zone:'forest',shape:'moth',colors:['#b6a2da','#f3dbef']},{id:'verden',name:'Верден',desc:'Моховой зверёк',zone:'garden',shape:'fox',colors:['#557f69','#a5c69a']},{id:'florax',name:'Флоракс',desc:'Цветочное создание',zone:'garden',shape:'flower',colors:['#8e587f','#d6a6c3']},{id:'crystal',name:'Кристаллис',desc:'Кристальный зверёк',zone:'cave',shape:'dragon',colors:['#537d9d','#b0d8f5']},{id:'echor',name:'Эхор',desc:'Пещерное создание',zone:'cave',shape:'bat',colors:['#706c91','#c4b7db']}];
const ZONES={forest:{name:'Шепчущий лес',desc:'Туманные тропы, тихие гнёзда и серебристые огоньки.',cost:0},garden:{name:'Забытая оранжерея',desc:'Сад за стеклом, где цветы шепчутся ночью.',cost:80},cave:{name:'Хрустальные пещеры',desc:'Подземные озёра и камни с собственным светом.',cost:160}};
const PATTERNS=['Без узора','Лунные пятна','Полосы','Звёздная пыль','Мрамор'];const FEATURES=['Мерцающие глаза','Шёлковая шерсть','Светящийся след','Серебряная аура','Кристальные искры'];const TEMPER=['Любопытный','Спокойный','Осторожный','Игривый','Мечтательный'];const ROLES=['Альфа','Бета','Омега'];const SCENTS=['Кедр','Дождь','Лаванда','Мох','Ваниль','Озон','Сирень','Мята'];
const DECOR={rug:{name:'Лунный ковёр',price:30},lamp:{name:'Светильник',price:45},nest:{name:'Мягкое гнездо',price:50},plant:{name:'Ночное растение',price:35}};
const pick=a=>a[Math.floor(Math.random()*a.length)],rand=n=>Math.floor(Math.random()*n),uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svgFor(sid,seed=0){const sp=SPECIES.find(s=>s.id===sid)||SPECIES[0],a=sp.colors[0],b=sp.colors[1];let body='';if(sp.shape==='fox')body=`<path d="M76 113 63 46 104 72 145 42 151 113" fill="${a}" stroke="${b}" stroke-width="5"/><ellipse cx="109" cy="123" rx="65" ry="53" fill="${a}" stroke="${b}" stroke-width="5"/><path d="M88 142 Q109 160 130 142" fill="none" stroke="${b}" stroke-width="4"/>`;if(sp.shape==='moth')body=`<ellipse cx="70" cy="95" rx="50" ry="60" fill="${b}" opacity=".8"/><ellipse cx="150" cy="95" rx="50" ry="60" fill="${b}" opacity=".8"/><ellipse cx="109" cy="123" rx="39" ry="63" fill="${a}"/><path d="M100 72 Q80 35 67 40 M118 72 Q139 35 150 40" stroke="${b}" stroke-width="5" fill="none"/>`;if(sp.shape==='flower')body=`${[0,60,120,180,240,300].map(d=>`<ellipse cx="110" cy="75" rx="26" ry="53" transform="rotate(${d} 110 120)" fill="${b}" stroke="${a}" stroke-width="3"/>`).join('')}<circle cx="110" cy="120" r="46" fill="${a}"/>`;if(sp.shape==='dragon')body=`<path d="M54 128 27 91 79 106 91 60 109 81 137 53 145 93 185 94 160 130" fill="${b}" opacity=".85"/><ellipse cx="110" cy="126" rx="61" ry="49" fill="${a}" stroke="${b}" stroke-width="5"/><path d="M70 85 88 33 104 86 M119 83 139 29 150 89" fill="${b}"/>`;if(sp.shape==='bat')body=`<path d="M96 105 Q60 43 20 80 L30 125 54 115 68 145 94 126 M124 105 Q160 43 200 80 L190 125 166 115 152 145 126 126" fill="${b}"/><path d="M73 91 78 47 100 79 120 79 144 47 147 91" fill="${a}"/><ellipse cx="110" cy="125" rx="45" ry="50" fill="${a}"/>`;const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220"><defs><radialGradient id="g"><stop stop-color="#715c91"/><stop offset="1" stop-color="#1b1628"/></radialGradient></defs><rect width="220" height="220" rx="20" fill="url(#g)"/><g opacity=".55" fill="#e8d6ff"><circle cx="27" cy="30" r="2"/><circle cx="189" cy="38" r="3"/><circle cx="173" cy="180" r="2"/><circle cx="44" cy="180" r="2"/></g>${body}<ellipse cx="92" cy="121" rx="7" ry="10" fill="#f6e8ff"/><ellipse cx="130" cy="121" rx="7" ry="10" fill="#f6e8ff"/><circle cx="93" cy="120" r="3" fill="#241a30"/><circle cx="131" cy="120" r="3" fill="#241a30"/><path d="M104 142 Q110 147 116 142" stroke="#f4d7e9" stroke-width="3" fill="none"/><g opacity=".8"><path d="M170 48l5 9-5 9-5-9z" fill="#f3dfac"/></g></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function makeCreature(sid,parents=null){let inherited=(key,values)=>parents&&Math.random()<.77?pick(parents.map(p=>p[key])):pick(values);let role=inherited('role',ROLES);return {id:uid(),sid,name:SPECIES.find(s=>s.id===sid).name+' '+(rand(900)+100),stage:'Малыш',age:0,role,pattern:inherited('pattern',PATTERNS),feature:inherited('feature',FEATURES),temper:inherited('temper',TEMPER),scent:inherited('scent',SCENTS),rarity:pick(['Обычный','Обычный','Обычный','Необычный','Необычный','Редкий']),parents:parents?parents.map(p=>p.id):[],image:'',bond:30,active:false};}
function newGame(){let first=makeCreature('noct');first.stage='Взрослый';first.age=44;first.active=true;first.name='Нокт';return {version:1,coins:140,day:1,energy:4,creatures:[first],eggs:[],zones:['forest'],inventory:{},decor:{},discoveries:{noct:true},log:['День 1: убежище открыло двери. Первый обитатель уже ждёт тебя.'],tab:'home',story:null};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||newGame();if(!state||!Array.isArray(state.creatures))throw 0}catch(e){state=newGame()}let tab='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Не удалось сохранить. Возможно, изображения слишком большие.');return false}}
function log(s){state.log.unshift(`День ${state.day}: ${s}`);state.log=state.log.slice(0,80)}function toast(s){let r=document.getElementById('toastroot');r.innerHTML=`<div class="toast">${escapeHtml(s)}</div>`;setTimeout(()=>r.innerHTML='',3100)}function modal(html){document.getElementById('modalroot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>Сумрачный питомник</h2><button class="tiny" onclick="closeModal()">Закрыть ×</button></div>${html}</div></div>`}function closeModal(){document.getElementById('modalroot').innerHTML=''}function img(c){return c.image||svgFor(c.sid)}function speciesName(id){return SPECIES.find(s=>s.id===id)?.name||id}function pill(s,cls=''){return `<span class="tag ${cls}">${escapeHtml(s)}</span>`}function countActive(){return state.creatures.filter(c=>c.active).length}function canHatch(){return state.creatures.length<80}
function render(){document.getElementById('coins').textContent='◈ '+state.coins;document.getElementById('day').textContent='День '+state.day;let tabs=[['home','Убежище'],['explore','Экспедиции'],['eggs','Инкубатор'],['collection','Коллекция'],['bestiary','Бестиарий'],['shop','Лавка']];document.getElementById('nav').innerHTML=tabs.map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="changeTab('${id}')">${name}</button>`).join('');let map={home:renderHome,explore:renderExplore,eggs:renderEggs,collection:renderCollection,bestiary:renderBestiary,shop:renderShop};document.getElementById('app').innerHTML=map[tab]();}function changeTab(t){tab=t;render()}
function renderHome(){let active=state.creatures.filter(c=>c.active).slice(0,3);return `<div class="two"><section class="panel"><div class="row between"><h2>Лунное убежище</h2>${pill(`${state.creatures.length} существ`)}</div><div class="stage"><div class="silhouette" style="left:10%"></div><div class="silhouette" style="right:5%;height:190px"></div>${state.decor.rug?'<div class="stage-decoration" style="left:42%"></div>':''}${state.decor.lamp?'<div style="position:absolute;right:5%;bottom:24%;font-size:55px;color:#f5d6a3;text-shadow:0 0 30px #ffd17e">✧</div>':''}${active.map((c,i)=>`<div class="pet-stage" style="left:${8+i*31}%;bottom:${12+(i%2)*6}%" onclick="showCreature('${c.id}')"><img src="${img(c)}" alt="${escapeHtml(c.name)}"><label>${escapeHtml(c.name)}</label></div>`).join('')}</div><p class="muted compact">Нажми на питомца, чтобы открыть его карточку. В убежище можно поселить до трёх любимчиков.</p><div class="row"><button onclick="changeTab('explore')" class="primary">Отправиться в лес</button><button onclick="nextDay()">Следующий день</button></div></section><section class="panel"><h2>Сегодня в питомнике</h2><p>Энергия экспедиций: <b>${state.energy}/4</b></p><div class="meter"><span style="width:${state.energy*25}%"></span></div><p>Яиц в инкубаторе: <b>${state.eggs.length}</b></p><p>Открыто видов: <b>${Object.keys(state.discoveries).length}/${SPECIES.length}</b></p><hr class="divider"><h3>Последние события</h3><div class="scroll">${state.log.slice(0,7).map(x=>`<p class="compact">${escapeHtml(x)}</p>`).join('')}</div></section></div>`}
const EVENTS={forest:[['Тихое гнездо','Под корнями дерева что-то поблёскивает.','Заглянуть под корни','Собрать лунный мох'],['Туманная тропа','Из тумана доносится негромкое шуршание.','Пойти на звук','Осмотреть тропу'],['Серебряный ручей','У ручья лежат следы необычного существа.','Проследить за следами','Собрать камешки']],garden:[['Стеклянный купол','За разбитым стеклом мерцает цветочная чашечка.','Проверить цветок','Собрать лепестки'],['Забытый ящик','Среди лиан спрятан старый садовый ящик.','Открыть ящик','Осмотреть растения']],cave:[['Кристальный шёпот','В глубине пещеры отзывается тихий звон.','Идти на звон','Собрать кристаллы'],['Подземное озеро','В воде отражается необычный свет.','Осмотреть берег','Искать минералы']]};
function renderExplore(){return `<h2>Экспедиции</h2><p class="muted">Каждый поход тратит одну энергию. Энергия восстанавливается с наступлением нового игрового дня.</p><div class="grid">${Object.entries(ZONES).map(([id,z])=>`<div class="panel location ${id}"><div class="orb"></div><h3>${z.name}</h3><p>${z.desc}</p><p>${pill(state.zones.includes(id)?'Открыта':`Открыть за ${z.cost} ◈`)}</p><button class="primary" onclick="${state.zones.includes(id)?`startExplore('${id}')`:`unlock('${id}')`}">${state.zones.includes(id)?'Исследовать':'Открыть территорию'}</button></div>`).join('')}</div><div class="panel" style="margin-top:14px"><h3>Снаряжение</h3><p>Энергия: ${state.energy}/4 · Монеты: ${state.coins} ◈</p><button onclick="nextDay()">Начать новый день</button></div>`}
function unlock(id){if(state.coins<ZONES[id].cost)return toast('Не хватает лунных монет');state.coins-=ZONES[id].cost;state.zones.push(id);log('Открыта территория «'+ZONES[id].name+'».');save();render()}
function startExplore(id){if(state.energy<1)return toast('Энергия закончилась. Начни следующий день.');state.energy--;let ev=pick(EVENTS[id]);state.story={zone:id,ev};save();modal(`<h3>${ev[0]}</h3><p>${ev[1]}</p><button class="choice" onclick="resolveExplore(true)">${ev[2]}</button><button class="choice" onclick="resolveExplore(false)">${ev[3]}</button><p class="muted compact">Каждое решение приносит находку, но результаты могут различаться.</p>`);render()}
function resolveExplore(risky){let st=state.story;if(!st)return;let n=rand(100),sid=pick(SPECIES.filter(s=>s.zone===st.zone)).id;let reward='';if(n<(risky?55:24)){let egg={id:uid(),sid,days:0,parents:[],role:pick(ROLES),pattern:pick(PATTERNS),feature:pick(FEATURES),temper:pick(TEMPER),scent:pick(SCENTS),rarity:n<7?'Редкий':n<20?'Необычный':'Обычный'};state.eggs.push(egg);reward=`Найдено яйцо вида «${speciesName(sid)}»! Оно отправлено в инкубатор.`}else if(n<(risky?80:75)){let amount=15+rand(25);state.coins+=amount;reward=`Найдено ${amount} лунных монет.`}else{let resource=st.zone==='forest'?'Лунный мох':st.zone==='garden'?'Ночные лепестки':'Осколки кристалла';state.inventory[resource]=(state.inventory[resource]||0)+1;reward=`Найден материал «${resource}».`}state.story=null;log(reward);save();closeModal();render();modal(`<h3>Результат экспедиции</h3><p>${reward}</p><button class="primary" onclick="closeModal()">Продолжить</button>`)}
function nextDay(){state.day++;state.energy=4;let grew=[];state.eggs.forEach(e=>e.days++);state.creatures.forEach(c=>{if(c.stage!=='Взрослый'){c.age++;let old=c.stage;c.stage=c.age>=7?'Взрослый':c.age>=4?'Подросток':c.age>=2?'Ребёнок':'Малыш';if(old!==c.stage)grew.push(`${c.name}: ${c.stage}`)}});state.coins+=8;log('Наступил новый день. Энергия восстановлена, питомник получил 8 ◈.');grew.forEach(x=>log('Взросление — '+x));save();render();toast('Новый день. Энергия восстановлена!')}
function renderEggs(){return `<div class="row between"><h2>Инкубатор</h2><button onclick="nextDay()">Следующий день</button></div><p class="muted">Яйца раскрываются после двух игровых дней. Существа взрослеют за семь дней; взрослые не стареют.</p><div class="grid">${state.eggs.map(e=>`<div class="panel" style="text-align:center"><div class="egg"></div><h3>Яйцо · ${speciesName(e.sid)}</h3>${pill(e.rarity,'gold')}<p>${e.days>=2?'Готово к вылуплению':`Развитие: ${e.days}/2 дней`}</p><button class="primary" ${e.days<2||!canHatch()?'disabled':''} onclick="hatch('${e.id}')">${e.days>=2?'Открыть яйцо':'Ожидание'}</button></div>`).join('')||'<div class="panel"><h3>Пока пусто</h3><p>Отправляйся в экспедиции, чтобы находить яйца.</p><button onclick="changeTab(\'explore\')">К экспедициям</button></div>'}</div><div class="panel" style="margin-top:14px"><h3>Создание потомства</h3><p class="muted">Выбери двух взрослых существ одного вида. Вторичные роли и ароматы наследуются как игровые признаки. Для семейных пар действует проверка близкого родства.</p><button onclick="breedingModal()">Выбрать пару</button></div>`}
function hatch(id){let idx=state.eggs.findIndex(e=>e.id===id);if(idx<0||state.eggs[idx].days<2||!canHatch())return;let e=state.eggs.splice(idx,1)[0],c=makeCreature(e.sid);Object.assign(c,{role:e.role,pattern:e.pattern,feature:e.feature,temper:e.temper,scent:e.scent,rarity:e.rarity,parents:e.parents});state.creatures.push(c);state.discoveries[c.sid]=true;log(`Вылупился ${c.name}! Вид: ${speciesName(c.sid)}.`);save();render();showCreature(c.id)}
function relatives(a,b){if(a.id===b.id)return true;if(a.parents.includes(b.id)||b.parents.includes(a.id))return true;if(a.parents.some(id=>b.parents.includes(id)))return true;return false}
function breedingModal(){let adults=state.creatures.filter(c=>c.stage==='Взрослый');modal(`<h3>Новая кладка</h3><p>Для получения яйца нужны два взрослых неродственных существа одного вида. Роль альфы, беты или омеги не ограничивает возможность создать потомство.</p><label>Первое существо</label><select id="parent1" style="width:100%">${adults.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} · ${speciesName(c.sid)}</option>`).join('')}</select><p><label>Второе существо</label></p><select id="parent2" style="width:100%">${adults.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} · ${speciesName(c.sid)}</option>`).join('')}</select><p class="muted compact">Стоимость подготовки гнезда: 35 ◈. Яйцо появится сразу, вылупится через два игровых дня.</p><button class="primary" onclick="breed()">Подготовить кладку</button>`)}
function breed(){let a=state.creatures.find(c=>c.id===document.getElementById('parent1')?.value),b=state.creatures.find(c=>c.id===document.getElementById('parent2')?.value);if(!a||!b||a.stage!=='Взрослый'||b.stage!=='Взрослый'||a.sid!==b.sid||relatives(a,b))return toast('Нужны два взрослых неродственных существа одного вида.');if(state.coins<35)return toast('Не хватает 35 монет');state.coins-=35;let c=makeCreature(a.sid,[a,b]);state.eggs.push({id:uid(),sid:c.sid,days:0,parents:c.parents,role:c.role,pattern:c.pattern,feature:c.feature,temper:c.temper,scent:c.scent,rarity:c.rarity});log(`У ${a.name} и ${b.name} появилось яйцо.`);save();closeModal();render();toast('Новое яйцо отправлено в инкубатор!')}
function renderCollection(){return `<div class="row between"><h2>Мои существа</h2>${pill(state.creatures.length+' всего')}</div><p class="muted">Нажми на карточку, чтобы переименовать питомца, загрузить изображение, выбрать место в убежище или посмотреть происхождение.</p><div class="grid">${state.creatures.map(c=>`<div class="panel creature"><img class="art" src="${img(c)}" alt="${escapeHtml(c.name)}"><h3>${escapeHtml(c.name)}</h3><div>${pill(speciesName(c.sid))}${pill(c.role)}${pill(c.rarity,'gold')}</div><p class="muted compact">${c.stage} · ${c.temper} · ${c.scent}</p><button class="primary" onclick="showCreature('${c.id}')">Открыть карточку</button></div>`).join('')}</div>`}
function showCreature(id){let c=state.creatures.find(x=>x.id===id);if(!c)return;let parents=c.parents.map(id=>state.creatures.find(p=>p.id===id)?.name||'Из архива');modal(`<div class="portrait-row"><img class="portrait no-grow" src="${img(c)}" alt=""><div><h3>${escapeHtml(c.name)}</h3><div>${pill(speciesName(c.sid))}${pill(c.stage)}${pill(c.rarity,'gold')}</div></div></div><hr class="divider"><div class="grid"><div><p><b>Вторичная роль:</b> ${c.role}</p><p><b>Аромат:</b> ${c.scent}</p><p><b>Характер:</b> ${c.temper}</p></div><div><p><b>Окраска:</b> ${SPECIES.find(s=>s.id===c.sid).colors[0]}</p><p><b>Узор:</b> ${c.pattern}</p><p><b>Особенность:</b> ${c.feature}</p></div></div><p><b>Происхождение:</b> ${parents.length?parents.map(escapeHtml).join(' и '):'Найден в дикой природе / первый житель'}</p><p><label>Имя питомца</label></p><div class="row"><input id="petname" maxlength="36" value="${escapeHtml(c.name)}"><button onclick="renamePet('${id}')">Сохранить имя</button></div><p><label>Собственное изображение (PNG, JPG, WebP)</label></p><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadPet('${id}',this)"><div class="row" style="margin-top:10px"><button onclick="toggleActive('${id}')">${c.active?'Убрать из убежища':'Поселить в убежище'}</button><button onclick="resetImage('${id}')">Вернуть рисунок вида</button></div><p class="muted compact">Изображение сохраняется локально. Для надёжности выбирай файлы до 1 МБ.</p>`)}
function renamePet(id){let c=state.creatures.find(x=>x.id===id),name=document.getElementById('petname').value.trim();if(!name)return toast('Укажи имя');c.name=name;save();closeModal();render()}function toggleActive(id){let c=state.creatures.find(x=>x.id===id);if(!c.active&&countActive()>=3)return toast('В убежище уже три существа. Убери одного из них.');c.active=!c.active;save();closeModal();render()}function resetImage(id){let c=state.creatures.find(x=>x.id===id);c.image='';save();closeModal();render();showCreature(id)}
function uploadPet(id,input){let file=input.files[0];if(!file)return;if(file.size>3e6)return toast('Файл слишком большой. Выбери изображение до 3 МБ.');let reader=new FileReader();reader.onload=()=>{let image=new Image();image.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,420/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let c=state.creatures.find(x=>x.id===id),old=c.image;c.image=canvas.toDataURL('image/webp',.8);if(!save())c.image=old;closeModal();render();showCreature(id)};image.src=reader.result};reader.readAsDataURL(file)}
function renderBestiary(){return `<h2>Бестиарий</h2><p class="muted">Новые виды открываются после вылупления. Редкие сочетания признаков сохраняются в карточках питомцев.</p><div class="grid">${SPECIES.map(s=>{let found=state.discoveries[s.id];return `<div class="panel"><img class="art" src="${svgFor(s.id)}" style="${found?'':'filter:grayscale(1) brightness(.25)'}" alt=""><h3>${found?s.name:'Неизвестный вид'}</h3><p>${found?s.desc:'Ещё не обнаружен'}</p><p class="muted compact">${found?ZONES[s.zone].name:'???'}</p>${pill(found?'Открыт':'Неизвестен',found?'green':'')}</div>`}).join('')}</div>`}
function renderShop(){return `<h2>Ночная лавка</h2><p class="muted">Монеты добываются в экспедициях и с каждым новым игровым днём. Купленные украшения появляются в убежище.</p><div class="grid">${Object.entries(DECOR).map(([id,d])=>`<div class="panel"><div style="font-size:42px;color:#d8bce5;text-align:center">${({rug:'◉',lamp:'✧',nest:'◡',plant:'❦'})[id]}</div><h3>${d.name}</h3><p>${d.price} ◈</p><button class="primary" onclick="buyDecor('${id}')" ${state.decor[id]?'disabled':''}>${state.decor[id]?'Уже куплено':'Купить'}</button></div>`).join('')}</div><div class="panel" style="margin-top:14px"><h3>Материалы</h3>${Object.entries(state.inventory).map(([k,v])=>`<p>${escapeHtml(k)}: ${v}</p>`).join('')||'<p class="muted">Пока нет материалов.</p>'}</div>`}function buyDecor(id){if(state.decor[id])return;if(state.coins<DECOR[id].price)return toast('Недостаточно монет');state.coins-=DECOR[id].price;state.decor[id]=true;log('Куплено украшение: '+DECOR[id].name);save();render();toast('Украшение появилось в убежище!')}
function openSettings(){modal(`<h3>Настройки и сохранения</h3><p>Сохранение выполняется автоматически в этом браузере. Оно никак не связано с «В кармане».</p><div class="row"><button onclick="exportSave()">Скачать резервную копию</button><button onclick="document.getElementById('importsave').click()">Загрузить копию</button></div><input id="importsave" class="hidden" type="file" accept="application/json" onchange="importSave(this)"><hr class="divider"><p>Взрослые не стареют. Для ускорения инкубации можно переходить к следующему дню вручную.</p><p class="muted compact">Это самостоятельная офлайн-игра в одном HTML-файле. Для сохранения пользовательских изображений используется локальное хранилище браузера.</p><button onclick="resetGame()" style="border-color:#aa707e">Начать новую игру (сброс)</button>`)}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sumrachny_pitomnik_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importSave(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj||!Array.isArray(obj.creatures)||!Array.isArray(obj.eggs)||typeof obj.coins!=='number')throw Error();if(!confirm('Заменить текущее сохранение загруженной копией?'))return;state=obj;save();closeModal();render();toast('Сохранение загружено')}catch(e){toast('Не удалось прочитать сохранение')}};r.readAsText(f)}function resetGame(){if(!confirm('Удалить прогресс «Сумрачного питомника» и начать заново?'))return;state=newGame();save();closeModal();tab='home';render()}
save();render();
</script></body></html>
